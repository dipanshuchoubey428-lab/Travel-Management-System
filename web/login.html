<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url("images/log1.jpg") no-repeat center center/cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Dark overlay for better visibility */
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            top: 0;
            left: 0;
            z-index: 0;
        }

        .login-box {
            width: 350px;
            padding: 30px;

            /* Glass effect */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3);

            box-shadow: 0px 8px 32px rgba(0,0,0,0.3);
            color: white;

            position: relative;
            z-index: 1;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }

        label {
            font-weight: bold;
            color: #fff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;

            border: none;
            outline: none;

            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .signup {
            text-align: center;
            margin-top: 15px;
        }

        .signup p {
            color: #eee;
        }

        .signup a {
            text-decoration: none;
            color: #a5b4fc;
            font-weight: bold;
        }

        .signup a:hover {
            text-decoration: underline;
        }

    </style>

</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form action="LoginServlet" method="post">

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>
        
       

        <button type="submit">Login</button>
        
        <div class="signup">
    <a href="forget.jsp">Forgot Password?</a>
</div>


    </form>

    <div class="signup">
        <p>Don't have an account?</p>
        <a href="signup.jsp">Create New Account</a>
    </div>

</div>

</body>
</html>
